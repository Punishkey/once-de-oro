<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1c29">
<meta name="description" content="Manager de fútbol entre amigos con los clubes de LaLiga.">
<title>Once de Oro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap">
</head><body>
<style>
/* Layout: estadio de noche. Una columna para móvil; pestañas fijas arriba. */
:root{
  --ink:#0e1c29; --panel:#16293a; --panel-2:#1d354a; --line:#2b4760;
  --chalk:#eef2ea; --muted:#93a9b9;
  --flood:#f6c945; --flood-ink:#1a1405;
  --win:#3fbf7f; --draw:#9aa7b2; --loss:#e0533f;
  --por:#f6c945; --def:#4fa3e0; --med:#3fbf7f; --del:#e0533f;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--flood);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 90px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:6px 10px}
.brand small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--flood);font-weight:700}
.brand h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(30px,8vw,44px);line-height:.95;text-transform:uppercase;text-wrap:balance}
.who{font-size:12px;color:var(--muted);text-align:right}
.who{display:grid;justify-items:end;gap:4px}
.who .em{max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.hdr-btn{border:1px solid var(--line);background:transparent;color:var(--chalk);border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;font-weight:700}
.who b{display:inline-block;background:var(--flood);color:var(--flood-ink);border-radius:999px;padding:2px 8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--ink);padding-block:8px;margin-bottom:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
nav.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 2px;font-weight:600;font-size:13px;min-width:0}
nav.tabs button[aria-selected="true"]{background:var(--flood);color:var(--flood-ink);border-color:var(--flood)}
h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:24px;letter-spacing:.02em;margin:24px 0 10px;text-wrap:balance}
h3{margin:0;font-size:15px}
.note{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.note.warn{border-color:var(--flood);color:var(--chalk)}
.btn{border-radius:9px;padding:10px 14px;font-weight:700;background:var(--panel-2);border:1px solid var(--line);touch-action:manipulation}
.btn.primary{background:var(--flood);color:var(--flood-ink);border-color:var(--flood)}
.btn.small{padding:7px 10px;font-size:13px}
.btn.danger{color:#ffb4a8;border-color:#6b3a33}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.card>*{min-width:0}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--panel-2);border-radius:10px;padding:10px 8px;display:grid;gap:2px;min-width:0}
.stat .lbl{font-size:10px;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v.hl{color:var(--flood)}
.kit{width:30px;height:30px;border-radius:50%;background:var(--c1);box-shadow:inset 0 0 0 4px var(--c2),0 0 0 1px rgba(255,255,255,.25);flex:none;display:inline-block;vertical-align:middle}
.kit.sm{width:14px;height:14px;box-shadow:inset 0 0 0 3px var(--c2),0 0 0 1px rgba(255,255,255,.25)}
.pos{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;padding:2px 5px;border-radius:4px;color:#0b1520;min-width:32px;text-align:center}
.pos.POR{background:var(--por)}.pos.DEF{background:var(--def)}.pos.MED{background:var(--med)}.pos.DEL{background:var(--del)}
.up{color:var(--win)}.down{color:var(--loss)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;text-align:center;white-space:nowrap}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid rgba(255,255,255,.05)}
tr:last-child td{border-bottom:0}
th.l{text-align:left}
td.nm{text-align:left;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
td.nm .kit{margin-right:6px}
td.nm small{color:var(--muted);margin-left:4px}
td.pts{font-weight:800;color:var(--flood);font-size:16px}
tr.me td{background:rgba(246,201,69,.1)}
.form{display:inline-flex;gap:3px}
.form i{width:18px;height:18px;border-radius:4px;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center;color:#0b1520}
.form .G{background:var(--win)}.form .E{background:var(--draw)}.form .P{background:var(--loss)}
@media (max-width:480px){.hide-sm{display:none}}
.list{display:grid;gap:4px}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel);border:1px solid transparent;border-radius:9px;font-variant-numeric:tabular-nums;text-align:left;width:100%;min-width:0}
button.item:not(:disabled):hover{border-color:var(--line)}
.item .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{color:var(--muted);font-size:12px;white-space:nowrap}
.item .pr{font-weight:700;white-space:nowrap;text-align:right;min-width:62px}
.item .pr small{display:block;font-size:11px;font-weight:600}
.item .g{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--flood);min-width:28px;text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px}
.chip[aria-pressed="true"]{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.clubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.club{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);text-align:left;min-width:0}
.club span{min-width:0;display:grid}
.club b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club small{font-size:12px;color:var(--muted);white-space:nowrap}
.club[aria-pressed="true"]{border-color:var(--flood);box-shadow:0 0 0 1px var(--flood)}
.pitch{border-radius:14px;padding:12px 4px;background:repeating-linear-gradient(180deg,#1f7a3f 0 44px,#22864a 44px 88px);border:2px solid rgba(255,255,255,.5);display:grid;gap:10px;min-width:0}
.line{display:flex;justify-content:center;gap:4px}
.slot{position:relative;flex:0 1 92px;min-width:0;display:grid;justify-items:center;gap:2px;text-align:center;background:rgba(8,18,26,.62);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:7px 3px;color:var(--chalk)}
.slot.empty{border-style:dashed;color:var(--muted)}
.slot.sel{outline:2px solid var(--flood)}
.slot .sn{font-weight:700;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .sv{font-size:11px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.slot .cap{position:absolute;top:-8px;right:-4px;background:var(--flood);color:var(--flood-ink);font-weight:900;font-size:11px;border-radius:50%;width:22px;height:22px;display:grid;place-items:center}
.fx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;margin-bottom:6px}
.fx-teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.fx-teams .t{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600}
.fx-teams .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fx-teams .t.a{justify-content:flex-end;text-align:right}
.score{font-family:var(--f-display);font-weight:900;font-size:22px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.score.pending{color:var(--muted);font-size:16px}
.fx-sc{font-size:12px;color:var(--muted);text-align:center}
.round-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 6px}
.round-head h3{font-family:var(--f-display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
label.f input,label.f select,.inp{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-transform:none;letter-spacing:0;font-size:15px;color:var(--chalk);width:100%;min-width:0}
label.f input[type=color]{padding:2px;height:42px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.team-head{display:flex;gap:10px;align-items:center}
.team-head input{flex:1;min-width:0;font-family:var(--f-display);font-size:22px;font-weight:800;text-transform:uppercase;background:transparent;border:0;border-bottom:1px solid var(--line);padding:4px 2px}
.sub2{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg3{grid-template-columns:repeat(3,1fr)}
.stt{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;white-space:nowrap;flex:none}
.stt.inj{background:rgba(224,83,63,.18);color:#ffb4a8}.stt.sus{background:rgba(246,201,69,.18);color:var(--flood)}.stt.ok{background:rgba(63,191,127,.18);color:var(--win)}
.fm{font-size:12px;flex:none}.fm.up{color:var(--win)}.fm.down{color:var(--loss)}
.mgr{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;background:var(--flood);color:var(--flood-ink);font-size:10px;font-weight:900;margin-left:4px;vertical-align:1px}
.slot.out{outline:2px solid var(--loss);outline-offset:-2px}
.item[disabled]{opacity:.45}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.06)}
.seg button{border:0;border-radius:9px;padding:10px 8px;font:inherit;font-weight:700;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--flood);color:var(--ink)}
.rx{display:grid;gap:6px;padding:10px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.rx-top{display:grid;grid-template-columns:minmax(0,1fr) 46px 46px minmax(0,1fr);gap:5px;align-items:center}
.rx-top input{text-align:center;font-weight:700}
.rx-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 52px 32px;gap:5px;align-items:center}
.rx select,.rx input{min-width:0;width:100%}
.rx .btn.small{justify-self:start}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 70px 56px 60px 32px;gap:5px;align-items:center}
.prow input,.prow select{background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:7px 5px;font-size:14px;width:100%;min-width:0}
.prow.h{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.x{border:1px solid #6b3a33;background:transparent;color:#ffb4a8;border-radius:7px;height:34px;font-weight:800}
details.adm{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.adm>summary{padding:12px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}
details.adm>summary::-webkit-details-marker{display:none}
details.adm>div{padding:0 12px 12px;display:grid;gap:8px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--flood);color:var(--flood-ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
.savebar .btn{background:var(--ink);color:var(--chalk);border-color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--chalk);color:var(--ink);font-weight:700;padding:10px 16px;border-radius:999px;z-index:90;max-width:calc(100% - 32px);text-align:center}
.help{font-size:13px;color:var(--muted)}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:4px 16px;font-size:13px;color:var(--muted)}
.legend b{color:var(--chalk);font-variant-numeric:tabular-nums}

/* ===== Portada ===== */
body.covered{overflow:hidden}
#cover{position:fixed;inset:0;z-index:40;overflow-y:auto;overflow-x:hidden;background:radial-gradient(120% 70% at 50% 0%,#17324a 0%,#0b1724 55%,#060e16 100%);color:var(--chalk)}
.cv-beams{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cv-beams i{position:absolute;top:-10%;width:42vmax;height:120%;transform-origin:50% 0;background:linear-gradient(180deg,rgba(255,236,170,.28),rgba(255,236,170,0) 70%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);filter:blur(2px);animation:sweep 9s ease-in-out infinite alternate}
.cv-beams i:nth-child(1){left:-12vmax;transform:rotate(-28deg)}
.cv-beams i:nth-child(2){right:-12vmax;transform:rotate(28deg);animation-delay:-4s}
.cv-beams i:nth-child(3){left:calc(50% - 21vmax);opacity:.5;transform:rotate(0);animation-duration:12s}
@keyframes sweep{from{opacity:.55}to{opacity:1}}
.cv-lamps{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;padding-inline:max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.cv-lamps span{display:grid;grid-template-columns:repeat(4,7px);gap:4px;padding:6px;border-radius:6px;background:rgba(255,255,255,.05)}
.cv-lamps b{width:7px;height:7px;border-radius:50%;background:#fff6d8;box-shadow:0 0 10px 3px rgba(255,230,150,.75)}
.cv-pitch{position:absolute;left:50%;bottom:-6vh;width:160vmax;height:62vh;transform:translateX(-50%) perspective(520px) rotateX(62deg);transform-origin:50% 100%;background:repeating-linear-gradient(90deg,#1c6e39 0 8%,#1f7a3f 8% 16%);border-top:3px solid rgba(255,255,255,.55);pointer-events:none;mask-image:linear-gradient(0deg,#000 40%,transparent 100%);-webkit-mask-image:linear-gradient(0deg,#000 40%,transparent 100%)}
.cv-pitch::before{content:"";position:absolute;left:50%;top:12%;width:22vmax;height:22vmax;margin-left:-11vmax;border:3px solid rgba(255,255,255,.5);border-radius:50%}
.cv-pitch::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px solid rgba(255,255,255,.5)}
.cv-inner{position:relative;min-height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:calc(64px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px))}
.cv-eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--flood);font-weight:700;display:flex;align-items:center;gap:10px}
.cv-eyebrow::before{content:"";width:26px;height:2px;background:var(--flood)}
.cv-title{margin:0;font-family:var(--f-display);font-weight:900;text-transform:uppercase;line-height:.8;font-size:clamp(84px,27vw,150px);letter-spacing:-.01em}
.cv-title span{display:block}
.cv-title .gold{background:linear-gradient(180deg,#fff2b8 0%,#f6c945 45%,#c6901c 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(246,201,69,.35))}
.cv-ball{display:inline-block;width:.62em;height:.62em;margin-left:.06em;vertical-align:.04em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#e9e2cf 45%,#b9ad8c 100%);box-shadow:inset -6px -8px 0 rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.4);position:relative;animation:spin 6s linear infinite}
.cv-ball::after{content:"";position:absolute;inset:28%;background:#1b1b1b;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)}
@keyframes spin{to{transform:rotate(360deg)}}
.cv-lead{margin:0;font-size:17px;line-height:1.45;color:#cfdbe3;max-width:34ch}
.cv-card{background:rgba(14,28,41,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(246,201,69,.35);border-radius:18px;padding:18px;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.cv-card h2{margin:0;font-size:26px}
.cv-card .btn{padding:14px 16px;font-size:16px}
.cv-card .btn.primary{box-shadow:0 8px 24px rgba(246,201,69,.3)}
.cv-me{display:flex;align-items:center;gap:12px}
.cv-me .kit{width:46px;height:46px;box-shadow:inset 0 0 0 6px var(--c2),0 0 0 1px rgba(255,255,255,.3)}
.cv-me b{font-family:var(--f-display);font-size:26px;line-height:1;text-transform:uppercase;display:block;overflow-wrap:anywhere}
.cv-link{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px;font-size:14px;justify-self:center}
.cv-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:rgba(255,255,255,.12);border-radius:12px;overflow:hidden}
.cv-stats div{background:rgba(8,18,27,.82);padding:10px;display:grid;gap:2px;min-width:0}
.cv-stats b{font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cv-stats span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.cv-in>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.cv-in>*:nth-child(2){animation-delay:.08s}.cv-in>*:nth-child(3){animation-delay:.16s}.cv-in>*:nth-child(4){animation-delay:.24s}.cv-in>*:nth-child(5){animation-delay:.32s}
@keyframes rise{from{transform:translateY(14px);opacity:.01}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.cv-beams i,.cv-ball,.cv-in>*{animation:none}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>Once de Oro</small><h1 id="league-name">Once de Oro</h1></div>
    <div class="who" id="who"></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"><div class="note">Cargando la liga…</div></main>
</div>
<div class="savebar" id="savebar" hidden><span id="savebar-msg">Tienes cambios sin guardar</span><div class="row"><button class="btn small" id="discard">Descartar</button><button class="btn small" id="savenow">Guardar</button></div></div>
<div class="toast" id="toast" hidden></div>
<div id="cover" hidden><div class="cv-beams"><i></i><i></i><i></i></div><div class="cv-lamps"><span><b></b><b></b><b></b><b></b></span><span><b></b><b></b><b></b><b></b></span></div><div class="cv-pitch"></div>
  <div class="cv-inner cv-in">
    <div class="cv-eyebrow" id="cv-league">Liga entre amigos</div>
    <h1 class="cv-title"><span>Once</span><span>de <span class="gold" style="display:inline">Oro</span><i class="cv-ball" aria-hidden="true"></i></span></h1>
    <p class="cv-lead">Coge un club de LaLiga, elige el once y la táctica, ficha y gana la liga a tus amigos.</p>
    <div class="cv-card" id="cv-card"><div class="help">Cargando…</div></div>
    <div class="cv-stats" id="cv-stats"></div>
  </div></div>


<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'')+Math.random().toString(36).slice(2,9);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const POSS=['POR','DEF','MED','DEL'];
const FORMS={'4-3-3':[4,3,3],'4-4-2':[4,4,2],'3-5-2':[3,5,2],'3-4-3':[3,4,3],'5-3-2':[5,3,2],'4-5-1':[4,5,1]};
// Táctica: multiplica los goles propios (a) y los que te marcan (d).
const TACT={defensiva:{a:.82,d:.8,l:'Defensiva'},equilibrada:{a:1,d:1,l:'Equilibrada'},ofensiva:{a:1.18,d:1.15,l:'Ofensiva'}};
const SCORE_W={POR:.01,DEF:.12,MED:.3,DEL:.57},ASSIST_W={POR:.02,DEF:.22,MED:.46,DEL:.3};
const WAGE=.004,BUY=1.1,SELL=.9; // sueldos por jornada sobre el valor; precio de compra y de venta sobre el valor
const fmtM=v=>(r1(v)).toLocaleString('es-ES',{minimumFractionDigits:1,maximumFractionDigits:1})+' M';
const fmtR=p=>`nivel ${rt(p)}${p.dr>0?` <b class="up">▲${p.dr}</b>`:p.dr<0?` <b class="down">▼${-p.dr}</b>`:''}`;
const fmtD=v=>v>0?`<small class="up">▲ ${fmtM(v)}</small>`:v<0?`<small class="down">▼ ${fmtM(-v)}</small>`:'<small class="help">=</small>';
const now=()=>new Date().toISOString();

/* ---------- Estado ---------- */
let db=null,ME={id:null,owner:false},ready=false,noDb=false;
let L=null,MG=[],JS={},RE={};   // liga, mánagers, jornadas jugadas (por número)
let draft=null,dirty=false;
let tab='club',sub='alineacion',posFilter='TODOS',sortBy='nivel',query='',allRounds=false;
let ed=null;              // alineación en edición {formation,lineup,tactic,slot,changed}
let busy=false,readOnly=false;
const openTeams=new Set();
const blank=()=>({name:'Mi liga',season:'',settings:{doble:true,mercado:true,maxPlantilla:30,minPlantilla:16},teams:[],fixtures:[],trans:[]});
function normalize(d){
  d=Object.assign(blank(),d||{});d.settings=Object.assign(blank().settings,d.settings||{});
  d.teams=(d.teams||[]).map(t=>({cash:20,fans:2,...t,players:(t.players||[]).map(p=>({value:1,form:0,inj:0,sus:0,yc:0,dv:0,dr:0,r0:+p.rating||60,...p,tot:Object.assign({pj:0,g:0,a:0,nt:0},p.tot||{})}))}));
  d.fixtures=(d.fixtures||[]).map(f=>({...f}));d.trans=d.trans||[];
  return d;
}
const clone=x=>normalize(JSON.parse(JSON.stringify(x)));
const LG=()=>dirty&&draft?draft:L;
const team=(id,lg=LG())=>lg&&lg.teams.find(t=>t.id===id);
let _idx=null,_idxFor=null;
function IDX(lg=LG()){if(_idxFor!==lg){_idx={};if(lg)lg.teams.forEach(t=>t.players.forEach(p=>_idx[p.id]={p,t}));_idxFor=lg;}return _idx;}
function findP(lg,pid){for(const t of lg.teams){const p=t.players.find(x=>x.id===pid);if(p)return{p,t};}return null;}
const live=(f,lg=LG())=>team(f.h,lg)&&team(f.a,lg);
const mine=()=>MG.find(m=>m.id===ME.id);
const myClub=()=>{const m=mine();return m&&team(m.club,L);};
const mgrOf=id=>MG.find(m=>m.club===id);
const slotsOf=f=>{const [d,m,a]=FORMS[f]||FORMS['4-3-3'];return['POR',...Array(d).fill('DEF'),...Array(m).fill('MED'),...Array(a).fill('DEL')];};
const avail=p=>!(p.inj>0)&&!(p.sus>0);
const rt=p=>+p.rating||60;
const valueOf=p=>Math.max(.5,r1(2*Math.pow(1.09,rt(p)-60)*(1+clamp(p.form||0,-3,3)*.03)));
const wages=t=>r1(t.players.reduce((s,p)=>s+p.value,0)*WAGE);
const pendingOf=(m,lg=L)=>{const done=new Set((lg.trans||[]).map(t=>t.oid));return{buy:(m.ofertas||[]).filter(o=>!done.has(o.oid)),sell:(m.ventas||[]).filter(o=>!done.has(o.oid))};};
const status=p=>p.inj>0?`<span class="stt inj">Lesión ${p.inj}</span>`:p.sus>0?`<span class="stt sus">Sanción ${p.sus}</span>`:'';
const formIc=p=>{const f=p.form||0;return f>=1.5?'<span class="fm up" title="En forma">▲</span>':f<=-1.5?'<span class="fm down" title="Sin forma">▼</span>':'';};

/* ---------- Simulación ---------- */
function poisson(l){const L0=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L0);return k-1;}
function gauss(){return(Math.random()+Math.random()+Math.random()-1.5)*1.4;}
function pickW(arr,w){const ws=arr.map(w),s=ws.reduce((a,b)=>a+b,0);if(!s)return null;let r=Math.random()*s;for(let i=0;i<arr.length;i++){r-=ws[i];if(r<=0)return arr[i];}return arr[arr.length-1];}
function strength(t){const x=bestXI(t.players,'4-3-3').filter(Boolean);return x.length?x.reduce((s,p)=>s+rt(p),0)/x.length:50;}
// Mejor once disponible para una formación; si falta alguien de un puesto, juega otro de campo.
function bestXI(players,formation){
  const av=players.filter(avail),used=new Set(),k=p=>rt(p)+(p.form||0)*.6;
  const xi=slotsOf(formation).map(pos=>{const c=av.filter(p=>p.pos===pos&&!used.has(p.id)).sort((a,b)=>k(b)-k(a))[0];if(c)used.add(c.id);return c||null;});
  return xi.map((p,i)=>{if(p)return p;const pos=slotsOf(formation)[i],c=av.filter(x=>!used.has(x.id)&&(pos==='POR'||x.pos!=='POR')).sort((a,b)=>k(b)-k(a))[0];if(c)used.add(c.id);return c||null;});
}
function lineupFor(T){
  const m=mgrOf(T.id);
  if(!m)return{xi:bestXI(T.players,'4-3-3').filter(Boolean),tactic:null};
  const f=FORMS[m.formation]?m.formation:'4-3-3',sl=slotsOf(f),by=Object.fromEntries(T.players.map(p=>[p.id,p])),used=new Set();
  const xi=sl.map((pos,i)=>{const p=by[(m.lineup||[])[i]];if(p&&avail(p)&&!used.has(p.id)){used.add(p.id);return p;}return null;});
  const fill=bestXI(T.players.filter(p=>!used.has(p.id)),f);
  return{xi:xi.map((p,i)=>p||fill[i]).filter(Boolean),tactic:TACT[m.tactic]?m.tactic:'equilibrada'};
}
// Fichajes y ventas pendientes de los mánagers: se resuelven al empezar cada jornada.
function processTransfers(lg,r){
  const done=new Set(lg.trans.map(t=>t.oid)),log=[],reqs=[];
  if(!lg.settings.mercado)return log;
  MG.forEach(m=>{if(!team(m.club,lg))return;(m.ofertas||[]).forEach(o=>reqs.push({...o,k:'buy',club:m.club}));(m.ventas||[]).forEach(o=>reqs.push({...o,k:'sell',club:m.club}));});
  reqs.filter(o=>o.oid&&!done.has(o.oid)).sort((a,b)=>String(a.at).localeCompare(String(b.at))).forEach(o=>{
    const e=findP(lg,o.pid),me=team(o.club,lg),st=lg.settings,rec={oid:o.oid,round:r,k:o.k,pid:o.pid,name:e?e.p.name:'?',club:o.club,ok:false,msg:''};
    const move=(p,from,to)=>{from.players=from.players.filter(x=>x.id!==p.id);to.players.push(p);};
    if(!e)rec.msg='El jugador ya no está en la liga';
    else if(o.k==='buy'){const price=r1(e.p.value*BUY);rec.from=e.t.id;rec.price=price;
      if(e.t.id===me.id)rec.msg='Ya era tuyo';
      else if(mgrOf(e.t.id))rec.msg=`Ahora es del club de otro mánager`;
      else if(me.cash<price)rec.msg='No tenías dinero suficiente';
      else if(me.players.length>=st.maxPlantilla)rec.msg='Tu plantilla está llena';
      else if(e.t.players.length<=st.minPlantilla)rec.msg=`${e.t.name} no quiere quedarse sin jugadores`;
      else{move(e.p,e.t,me);me.cash=r1(me.cash-price);e.t.cash=r1(e.t.cash+price);rec.ok=true;rec.msg=`Fichado del ${e.t.name} por ${fmtM(price)}`;}}
    else{const price=r1(e.p.value*SELL);rec.price=price;
      const dest=lg.teams.filter(t=>t.id!==me.id&&!mgrOf(t.id)&&t.players.length<st.maxPlantilla).sort((a,b)=>a.players.length-b.players.length||b.cash-a.cash)[0];
      if(e.t.id!==me.id)rec.msg='Ya no era tuyo';
      else if(me.players.length<=st.minPlantilla)rec.msg=`Necesitas al menos ${st.minPlantilla} jugadores`;
      else if(!dest)rec.msg='Ningún club tenía sitio';
      else{move(e.p,me,dest);rec.to=dest.id;me.cash=r1(me.cash+price);dest.cash=r1(dest.cash-price);rec.ok=true;rec.msg=`Vendido al ${dest.name} por ${fmtM(price)}`;}}
    lg.trans.push(rec);log.push(rec);
  });
  return log;
}
function simRound(lg,r){
  const prev=JSON.parse(JSON.stringify(lg)),before={};
  lg.teams.forEach(t=>t.players.forEach(p=>before[p.id]=[rt(p),p.value]));
  const J={round:r,at:now(),ev:{},cards:{},inj:{},nt:{},fin:{},tac:{},tr:processTransfers(lg,r)};
  const fx=lg.fixtures.filter(f=>f.round===r&&f.hg==null&&live(f,lg)),playing=new Set();
  fx.forEach(f=>{playing.add(f.h);playing.add(f.a);});
  const out=new Set();lg.teams.forEach(t=>{if(playing.has(t.id))t.players.forEach(p=>{if(!avail(p))out.add(p.id);});});
  const inPlay=new Set(),fin=id=>J.fin[id]||(J.fin[id]={in:0,out:0});
  fx.forEach(f=>{
    const H=team(f.h,lg),A=team(f.a,lg),lh=lineupFor(H),la=lineupFor(A);
    const sx=x=>(x.length?x.reduce((s,p)=>s+rt(p)+(p.form||0)*.6,0)/x.length:45)-(11-x.length)*2.5;
    const sh=sx(lh.xi)+1.5,sa=sx(la.xi);
    if(!lh.tactic)lh.tactic=sh>sa+4?'ofensiva':sh<sa-4?'defensiva':'equilibrada';
    if(!la.tactic)la.tactic=sa>sh+4?'ofensiva':sa<sh-4?'defensiva':'equilibrada';
    const q=sh/sa;
    f.hg=poisson(1.3*Math.pow(q,2.4)*TACT[lh.tactic].a*TACT[la.tactic].d+.1);
    f.ag=poisson(1.15*Math.pow(1/q,2.4)*TACT[la.tactic].a*TACT[lh.tactic].d);
    J.tac[f.id]=[lh.tactic,la.tactic];
    const ev=[],cards=[],inj=[];
    for(const [T,lu,gf,ga,side] of [[H,lh,f.hg,f.ag,'h'],[A,la,f.ag,f.hg,'a']]){
      const bench=T.players.filter(p=>avail(p)&&!lu.xi.includes(p)&&p.pos!=='POR').sort(()=>Math.random()-.5).slice(0,3);
      const played=[...lu.xi,...bench],tl={};played.forEach(p=>{tl[p.id]={g:0,a:0};inPlay.add(p.id);});
      for(let i=0;i<gf;i++){
        const s=pickW(played,p=>SCORE_W[p.pos]*rt(p)*(lu.xi.includes(p)?1:.45));if(!s)continue;tl[s.id].g++;
        let as=null;if(Math.random()<.7){as=pickW(played.filter(p=>p!==s),p=>ASSIST_W[p.pos]*rt(p));if(as)tl[as.id].a++;}
        ev.push([side,s.id,as?as.id:null,1+Math.floor(Math.random()*90)]);
      }
      played.forEach(p=>{const st=lu.xi.includes(p),t=tl[p.id],min=1+Math.floor(Math.random()*90);
        let nt=6+t.g*(p.pos==='DEL'?.9:1.2)+t.a*.6+(gf>ga?.4:gf<ga?-.4:0);
        if(st&&(p.pos==='POR'||p.pos==='DEF'))nt+=ga===0?.6:-.3*ga;
        nt+=(rt(p)-75)/25+gauss()*.45;if(!st)nt=6+(nt-6)*.6;nt=clamp(r1(nt),3,10);
        J.nt[p.id]=nt;p.tot.pj++;p.tot.g+=t.g;p.tot.a+=t.a;p.tot.nt=r1((p.tot.nt||0)+nt);
        const f2=st?1:.4;
        if(Math.random()<.008*f2){cards.push([side,p.id,'R',min]);p.sus=Math.max(p.sus||0,Math.random()<.35?2:1);}
        else if(Math.random()<({POR:.03,DEF:.16,MED:.13,DEL:.08}[p.pos])*f2){cards.push([side,p.id,'Y',min]);p.yc=(p.yc||0)+1;if(p.yc>=5){p.yc=0;p.sus=Math.max(p.sus||0,1);}}
        if(Math.random()<.018*f2){const n=1+Math.floor(Math.random()*Math.random()*6);inj.push([side,p.id,n]);p.inj=Math.max(p.inj||0,n);}
        // Evolución: los partidos buenos suben el nivel y los malos lo bajan; sin pasarse 8 del nivel de partida.
        const r0=p.r0??rt(p);let d=0;
        if(nt>=7.5&&Math.random()<.35)d=1;else if(nt<=5.2&&Math.random()<.35)d=-1;
        if(rt(p)>r0+4&&Math.random()<.15)d--;else if(rt(p)<r0-4&&Math.random()<.15)d++;
        p.r0=r0;p.rating=clamp(rt(p)+clamp(d,-1,1),Math.max(40,r0-8),Math.min(99,r0+8));
        p.form=clamp(r1((p.form||0)*.6+(nt-6.2)*.8),-3,3);
      });
    }
    J.ev[f.id]=ev.sort((a,b)=>a[3]-b[3]);J.cards[f.id]=cards;J.inj[f.id]=inj;
    fin(H.id).in+=r1((H.fans||2)*.6);
    if(f.hg>f.ag)fin(H.id).in+=1;else if(f.hg<f.ag)fin(A.id).in+=1;else{fin(H.id).in+=.4;fin(A.id).in+=.4;}
  });
  lg.teams.forEach(t=>{if(!playing.has(t.id))return;
    t.players.forEach(p=>{if(out.has(p.id)){if(p.inj>0)p.inj--;if(p.sus>0)p.sus--;}else if(!inPlay.has(p.id))p.form=r1((p.form||0)*.8);});
    fin(t.id).out+=wages(t);});
  lg.teams.forEach(t=>{const F=J.fin[t.id];if(F){F.in=r1(F.in);F.out=r1(F.out);t.cash=r1(t.cash+F.in-F.out);}
    t.players.forEach(p=>{const b=before[p.id]||[rt(p),p.value];p.value=valueOf(p);p.dr=rt(p)-b[0];p.dv=r1(p.value-b[1]);});});
  J.prev=prev;
  return J;
}
function nextRound(lg=L){const fs=lg.fixtures.filter(f=>f.hg==null&&live(f,lg));return fs.length?Math.min(...fs.map(f=>f.round)):null;}
function lastRound(lg=L){const rs=lg.fixtures.filter(f=>f.hg!=null).map(f=>f.round);return rs.length?Math.max(...rs):null;}
function buildFixtures(ids,doble){
  const t=[...ids].sort(()=>Math.random()-.5);if(t.length%2)t.push(null);
  const n=t.length,rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a!=null&&b!=null)m.push((r+i)%2?[b,a]:[a,b]);}rounds.push(m);t.splice(1,0,t.pop());}
  const all=doble?[...rounds,...rounds.map(m=>m.map(([a,b])=>[b,a]))]:rounds;
  const fx=[];all.forEach((m,ri)=>m.forEach(([h,a])=>fx.push({id:uid('f'),round:ri+1,h,a,hg:null,ag:null})));
  return fx;
}

/* ---------- Cálculos ---------- */
function standings(lg=LG()){
  const rows={};lg.teams.forEach(t=>rows[t.id]={t,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0,form:[]});
  lg.fixtures.filter(f=>f.hg!=null&&rows[f.h]&&rows[f.a]).sort((x,y)=>x.round-y.round).forEach(f=>{
    const H=rows[f.h],A=rows[f.a];H.pj++;A.pj++;H.gf+=f.hg;H.gc+=f.ag;A.gf+=f.ag;A.gc+=f.hg;
    if(f.hg>f.ag){H.g++;A.p++;H.pts+=3;H.form.push('G');A.form.push('P');}
    else if(f.hg<f.ag){A.g++;H.p++;A.pts+=3;A.form.push('G');H.form.push('P');}
    else{H.e++;A.e++;H.pts++;A.pts++;H.form.push('E');A.form.push('E');}});
  return Object.values(rows).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||x.t.name.localeCompare(y.t.name));
}
const avgNt=p=>p.tot.pj?r1(p.tot.nt/p.tot.pj):null;

/* ---------- Render ---------- */
const kit=(t,cls)=>t?`<span class="kit${cls?' '+cls:''}" style="--c1:${esc(t.c1)};--c2:${esc(t.c2)}"></span>`:'';
function toast(msg){const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2800);}
function armed(btn,txt){
  if(btn.dataset.armed){delete btn.dataset.armed;return true;}
  btn.dataset.armed='1';const o=btn.textContent;btn.textContent=txt||'Toca otra vez para confirmar';
  setTimeout(()=>{if(btn.isConnected&&btn.dataset.armed){delete btn.dataset.armed;btn.textContent=o;}},3000);return false;
}
function tabsList(){const t=[['club','Mi club'],['liga','Liga'],['mercado','Mercado']];if(ME.owner)t.push(['admin','Admin']);return t;}
function render(){
  renderCover();
  const lg=LG();
  $('#league-name').textContent=lg?lg.name:'Once de Oro';
  $('#who').innerHTML=ME.id?`${ME.owner?'<b>Administrador</b>':`<span class="em">${esc(ME.email||'Conectado')}</span>`}<button class="hdr-btn" data-hdr="out">Salir</button>`:(noDb?'':'<button class="hdr-btn" data-hdr="in">Entrar</button>');
  $('#tabs').innerHTML=(ready&&L)?tabsList().map(([k,l])=>`<button role="tab" data-tab="${k}" aria-selected="${tab===k}">${l}</button>`).join(''):'';
  $('#savebar').hidden=!(dirty||(ed&&ed.changed));
  $('#savebar-msg').textContent=ed&&ed.changed&&!dirty?'Alineación sin guardar':'Tienes cambios sin guardar';
  const v=$('#view');
  if(noDb){v.innerHTML=`<div class="note warn">No se pudo conectar con el servidor de la liga. Revisa tu conexión y recarga la página.</div>`;return;}
  if(!ready){v.innerHTML=`<div class="note">Cargando la liga…</div>`;return;}
  if(!L){v.innerHTML=`<div class="note">El administrador todavía no ha creado la liga.</div>`;return;}
  const s=document.activeElement&&document.activeElement.id==='q'?document.activeElement.selectionStart:null;
  v.innerHTML=tab==='liga'?viewLiga():tab==='mercado'?viewMercado():tab==='admin'&&ME.owner?viewAdmin():viewClub();
  if(s!=null){const q=$('#q');if(q){q.focus();q.setSelectionRange(s,s);}}
}

/* --- Mi club --- */
function viewPick(){
  const free=L.teams.filter(t=>!mgrOf(t.id)).map(t=>({t,s:strength(t)})).sort((a,b)=>b.s-a.s);
  return`<div class="card"><div class="lbl">Elige tu club</div><p style="margin:0">Cada mánager dirige un club de LaLiga y nadie puede repetir. Los clubes sin mánager los lleva la máquina.</p></div>
  <div class="list" style="margin-top:12px">${free.map(({t,s})=>`<div class="item">${kit(t)}<span class="n">${esc(t.name)}<span class="sub2">nivel ${Math.round(s)} · ${t.players.length} jugadores · ${fmtM(t.cash)} en caja</span></span>${readOnly?'':`<button class="btn small primary" data-act="pick" data-t="${t.id}" ${busy?'disabled':''}>Dirigir</button>`}</div>`).join('')||'<div class="note">Todos los clubes tienen ya mánager.</div>'}</div>
  ${MG.length?`<h2>Ya cogidos</h2><div class="list">${MG.map(m=>team(m.club)).filter(Boolean).map(t=>`<div class="item">${kit(t,'sm')}<span class="n">${esc(t.name)}</span><span class="sub">${mgrOf(t.id).id===ME.id?'Tuyo':'Con mánager'}</span></div>`).join('')}</div>`:''}`;
}
function nextMatch(id,lg=L){return lg.fixtures.filter(f=>f.hg==null&&(f.h===id||f.a===id)).sort((a,b)=>a.round-b.round)[0];}
function viewClub(){
  if(!ME.id)return`<div class="note">Entra con tu cuenta para dirigir un club.</div>`;
  const m=mine(),T=myClub();
  if(!m||!T)return viewPick();
  const rows=standings(L),pos=rows.findIndex(x=>x.t.id===T.id)+1,row=rows[pos-1],nm=nextMatch(T.id),rival=nm&&team(nm.h===T.id?nm.a:nm.h);
  const bad=T.players.filter(p=>!avail(p)).length;

function lineupState(m,T){
  if(!ed||ed.mid!==m.id){const f=FORMS[m.formation]?m.formation:'4-3-3';let lu=(m.lineup||[]).slice();const sl=slotsOf(f);while(lu.length<sl.length)lu.push(null);
    ed={mid:m.id,formation:f,lineup:lu.slice(0,sl.length),tactic:TACT[m.tactic]?m.tactic:'equilibrada',slot:null,changed:false};}
  const own=new Set(T.players.map(p=>p.id));ed.lineup=ed.lineup.map(pid=>pid&&own.has(pid)?pid:null);

}
function viewAlineacion(m,T){

/* --- Liga --- */

  const my=mine();

  const byR={};lg.fixtures.filter(f=>live(f,lg)).forEach(f=>(byR[f.round]=byR[f.round]||[]).push(f));
  const rs=Object.keys(byR).map(Number).sort((a,b)=>a-b),nr=nextRound(lg),cut=nr??Infinity;

  <div class="chips" style="margin-bottom:8px">${['TODOS',...POSS].map(p=>`<button class="chip" data-act="posf" data-p="${p}" aria-pressed="${posFilter===p}">${p==='TODOS'?'Todos':p}</button>`).join('')}</div>

  <div class="list">${list.map(({p,t})=>{const price=r1(p.value*BUY),human=mgrOf(t.id),cant=!T||!mk||busy||T.cash-committed<price-1e-9;

/* ---------- Escrituras ---------- */
async function writeLeague(lg,msg){
  try{await db.doc('liga/estado').set(JSON.parse(JSON.stringify(lg)));L=normalize(lg);draft=null;dirty=false;render();if(msg)toast(msg);return true;}
  catch(e){toast('No se pudo guardar. Inténtalo de nuevo.');render();return false;}
}
function edit(){if(!draft)draft=clone(L);dirty=true;$('#savebar').hidden=false;return draft;}
async function saveManager(mid,body){
  busy=true;
  try{await db.doc('managers/'+mid).set(body);return true;}
  catch(e){const m=String(e&&e.message||'');
    if(/duplicate|unique|23505/i.test(m+(e&&e.code)))toast('Ese club acaba de cogerlo otro mánager.');
    else if(e&&e.code==='invalid_argument'){readOnly=true;toast('No tienes permiso para guardar. Sal y vuelve a entrar en tu cuenta.');}
    else toast('No se pudo guardar. Inténtalo de nuevo.');return false;}
  finally{busy=false;render();}
}
const mgrBody=m=>({club:m.club,formation:m.formation||'4-3-3',lineup:m.lineup||[],tactic:m.tactic||'equilibrada',ofertas:pendingOf(m).buy,ventas:pendingOf(m).sell,createdAt:m.createdAt||now()});
async function saveLineup(){
  const m=mine();if(!m||!ed)return;
  if(await saveManager(m.id,{...mgrBody(m),formation:ed.formation,lineup:ed.lineup,tactic:ed.tactic})){ed.changed=false;toast('Alineación guardada');render();}
}

/* ---------- Eventos ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render();scrollTo(0,0);});
$('#discard').addEventListener('click',()=>{draft=null;dirty=false;if(ed){ed=null;}render();});
$('#savenow').addEventListener('click',()=>{if(dirty&&draft)writeLeague(draft,'Cambios guardados');else if(ed&&ed.changed)saveLineup();});
$('#view').addEventListener('toggle',e=>{const d=e.target;if(!d.matches||!d.matches('details[data-ti]'))return;const t=LG().teams[+d.dataset.ti];if(t){d.open?openTeams.add(t.id):openTeams.delete(t.id);}},true);
$('#view').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const act=b.dataset.act,m=mine(),T=myClub();
  switch(act){
    case 'posf':posFilter=b.dataset.p;render();break;
    case 'sort':sortBy=b.dataset.s;render();break;
    case 'sub':sub=b.dataset.s;render();break;
    case 'all-rounds':allRounds=!allRounds;render();break;
    case 'pick':{const t=team(b.dataset.t,L);if(!t||mgrOf(t.id))break;if(!armed(b,'¿Seguro?'))break;
      const f='4-3-3',xi=bestXI(t.players,f).map(p=>p?p.id:null);
      if(await saveManager(ME.id,{club:t.id,formation:f,lineup:xi,tactic:'equilibrada',ofertas:[],ventas:[],createdAt:now()})){ed=null;sub='alineacion';toast(`¡Bienvenido al ${t.name}!`);}
      break;}
    case 'tactic':ed.tactic=b.dataset.k;ed.changed=true;render();break;
    case 'form':{const E=ed,by=Object.fromEntries(T.players.map(p=>[p.id,p])),old=E.lineup.filter(Boolean);E.formation=b.dataset.f;const sl=slotsOf(E.formation),used=new Set();
      E.lineup=sl.map(pos=>{const c=old.find(pid=>by[pid]&&by[pid].pos===pos&&!used.has(pid));if(c)used.add(c);return c||null;});
      const rest=bestXI(T.players.filter(p=>!used.has(p.id)),E.formation);E.lineup=E.lineup.map((pid,i)=>pid||(rest[i]?rest[i].id:null));
      E.slot=null;E.changed=true;render();break;}
    case 'slot':ed.slot=ed.slot===+b.dataset.i?null:+b.dataset.i;render();break;
    case 'put':ed.lineup[ed.slot]=b.dataset.pid;ed.slot=null;ed.changed=true;render();break;
    case 'unslot':ed.lineup[ed.slot]=null;ed.slot=null;ed.changed=true;render();break;
    case 'auto':ed.lineup=bestXI(T.players,ed.formation).map(p=>p?p.id:null);ed.slot=null;ed.changed=true;render();break;
    case 'save-lineup':saveLineup();break;
    case 'offer':{const e2=IDX(L)[b.dataset.pid];if(!e2||!m)break;const price=r1(e2.p.value*BUY);
      if(!armed(b,`Ofertar ${fmtM(price)}`))break;
      if(await saveManager(m.id,{...mgrBody(m),ofertas:[...pendingOf(m).buy,{oid:uid('o'),pid:e2.p.id,at:now()}]}))toast(`Oferta por ${e2.p.name} enviada. Se resuelve al jugarse la jornada.`);
      break;}
    case 'unoffer':if(m&&await saveManager(m.id,{...mgrBody(m),ofertas:pendingOf(m).buy.filter(o=>o.pid!==b.dataset.pid)}))toast('Oferta retirada');break;
    case 'sell':{const e2=IDX(L)[b.dataset.pid];if(!e2||!m)break;if(!armed(b,`Vender ${fmtM(r1(e2.p.value*SELL))}`))break;
      if(await saveManager(m.id,{...mgrBody(m),ventas:[...pendingOf(m).sell,{oid:uid('v'),pid:e2.p.id,at:now()}]}))toast(`${e2.p.name} a la venta. Se vende al jugarse la jornada.`);
      break;}
    case 'unsell':if(m&&await saveManager(m.id,{...mgrBody(m),ventas:pendingOf(m).sell.filter(o=>o.pid!==b.dataset.pid)}))toast('Ya no está a la venta');break;
    case 'del-mgr':if(armed(b)){try{await db.doc('managers/'+b.dataset.mid).delete();toast('Club liberado');}catch(err){toast('No se pudo liberar.');}}break;
    case 'sim':{let n=+b.dataset.n;const lg=clone(L);let r=nextRound(lg),done=0;busy=true;render();
      try{while(r!=null&&n-->0){const J=simRound(lg,r);await db.doc('jornadas/r'+r).set(J);JS[r]=J;done++;r=nextRound(lg);}}
      catch(err){toast('No se pudo guardar la jornada.');}
      busy=false;if(done)await writeLeague(lg,done===1?'Jornada jugada':`${done} jornadas jugadas`);else render();break;}
    case 'undo-round':{if(!armed(b))break;const lr=lastRound(L),J=JS[lr];if(!J||!J.prev)break;
      busy=true;render();if(await writeLeague(normalize(J.prev))){try{await db.doc('jornadas/r'+lr).delete();delete JS[lr];}catch(err){}toast(`Jornada ${lr} deshecha`);}busy=false;render();break;}
    case 'new-season':{if(!armed(b))break;const lg=clone(L);lg.fixtures=buildFixtures(lg.teams.map(t=>t.id),lg.settings.doble);
      lg.teams.forEach(t=>t.players.forEach(p=>{p.tot={pj:0,g:0,a:0,nt:0};p.dv=0;p.dr=0;p.inj=0;p.sus=0;p.yc=0;p.form=0;}));
      busy=true;render();for(const r of Object.keys(JS)){try{await db.doc('jornadas/r'+r).delete();}catch(err){}}JS={};busy=false;
      writeLeague(lg,'Temporada nueva creada');break;}
    case 'add-player':{const d=edit(),ti=+b.closest('[data-ti]').dataset.ti;d.teams[ti].players.push({id:uid('p'),name:'Nuevo jugador',pos:'MED',rating:65,r0:65,value:3.1,form:0,inj:0,sus:0,yc:0,dv:0,dr:0,tot:{pj:0,g:0,a:0,nt:0}});render();break;}
    case 'del-player':{const d=edit(),ti=+b.closest('[data-ti]').dataset.ti,pi=+b.closest('[data-pi]').dataset.pi;d.teams[ti].players.splice(pi,1);render();break;}
  }
});
$('#view').addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='q'){query=el.value;render();return;}
  if(el.dataset.s){const d=edit(),k=el.dataset.s;
    if(k==='name')d.name=el.value||'Mi liga';
    else if(k==='doble'||k==='mercado')d.settings[k]=el.value==='1';
    else d.settings[k]=Math.max(0,+el.value||0);
    $('#league-name').textContent=d.name;return;}
  const det=el.closest('[data-ti]');if(!det)return;const d=edit(),t=d.teams[+det.dataset.ti];
  if(el.dataset.t){const k=el.dataset.t;t[k]=k==='short'?el.value.toUpperCase().slice(0,3):k==='cash'?r1(+el.value||0):k==='fans'?clamp(Math.round(+el.value||1),1,5):el.value;if(k==='c1'||k==='c2')det.querySelector('summary .kit').style.setProperty('--'+k,el.value);}
  else if(el.dataset.p){const p=t.players[+el.closest('[data-pi]').dataset.pi],k=el.dataset.p;p[k]=(k==='rating'||k==='value')?Math.max(0,+el.value||0):el.value;if(k==='rating')p.r0=p.rating;}
});

/* ---------- Arranque ---------- */
const typing=()=>{const a=document.activeElement;return a&&a.matches&&a.matches('#view input,#view select')&&a.id!=='q'&&dirty;};
/* ---------- Portada ---------- */
let cover=true,cvForm=false;
function renderCover(){
  const el=$('#cover');el.hidden=!cover;document.body.classList.toggle('covered',cover);if(!cover)return;
  const a=document.activeElement;if(a&&a.closest&&a.closest('#cv-card')&&a.matches('input'))return;
  $('#cv-league').textContent=L?L.name:'Liga entre amigos';
  const card=$('#cv-card'),m=mine(),T=myClub();let h='';
  if(auth==='newpass')h=authCard();
  else if(noDb)h=`<h2>Sin conexión</h2><p style="margin:0">No se pudo conectar con el servidor de la liga. Revisa tu conexión y recarga la página.</p>`;
  else if(!ready)h=`<div class="help">Cargando la liga…</div>`;
  else if(!L)h=`<h2>Liga en preparación</h2><p style="margin:0">El administrador todavía no ha abierto la liga.</p>`;
  else if(m&&T){const rows=standings(L),pos=rows.findIndex(x=>x.t.id===T.id)+1;
    h=`<div class="cv-me">${kit(T)}<div style="min-width:0"><span class="lbl">Bienvenido, mánager</span><b>${esc(T.name)}</b></div></div>
      <div class="help">${rows[pos-1].pj?`Vas ${pos}º con ${rows[pos-1].pts} puntos · `:''}${fmtM(T.cash)} en caja</div>
      <button class="btn primary" data-cv="enter">Entrar al despacho</button>`;}
  else if(!ME.id)h=authCard();
  else h=`<h2>Elige tu club</h2><p style="margin:0">Ya tienes cuenta. Ahora coge un club libre de LaLiga y llévalo a lo más alto.</p>
      <button class="btn primary" data-cv="pick">Ver clubes libres</button>
      <button class="cv-link" data-cv="enter">Solo quiero mirar la liga</button>`;
  card.innerHTML=h;
  if(!h.includes('id="au-')&&!h.includes('data-cv="au-'))authMsg='';
  const st=$('#cv-stats');
  if(ready&&L){const nr=nextRound(L),tot=L.fixtures.length?Math.max(...L.fixtures.map(f=>f.round)):0,top=standings(L)[0];
    st.innerHTML=`<div><b>${MG.length}</b><span>Mánagers</span></div><div><b>${nr?`${nr}/${tot}`:'Fin'}</b><span>Jornada</span></div><div><b>${top&&top.pj?esc(top.t.short):'—'}</b><span>Líder</span></div>`;st.hidden=false;}
  else st.hidden=true;
}
$('#cover').addEventListener('click',async e=>{
  const b=e.target.closest('[data-cv]');if(!b||b.disabled)return;
  const k=b.dataset.cv;
  if(k.startsWith('au-')){authAction(k,b);return;}
  if(k==='enter'||k==='pick'){cover=false;if(k==='pick')tab='club';scrollTo(0,0);render();}
});

/* ---------- Supabase ---------- */
let sb=null,auth='login',authMsg='';
// Misma forma que la base de datos del prototipo: liga/estado, managers/<id>, jornadas/r<n>, reales/r<n>.
function makeDb(sb){
  const T=p=>{const [c,id]=p.split('/');
    if(c==='liga')return{t:'liga',k:'id',v:1};
    if(c==='managers')return{t:'managers',k:'user_id',v:id};
    if(c==='jornadas'||c==='reales')return{t:c,k:'round',v:id?+String(id).replace(/^r/,''):null};
    throw new Error('Ruta desconocida: '+p);};
  const chk=({error})=>{if(error){const e=new Error(error.message);e.code=error.code==='42501'||/row-level security|permission/i.test(error.message)?'invalid_argument':error.code;throw e;}};
  const loaders=[];let timer={};
  const watch=(t,fn)=>{loaders.push(fn);sb.channel('w-'+t+'-'+loaders.length).on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(timer[t]);timer[t]=setTimeout(fn,150);}).subscribe();};
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)loaders.forEach(f=>f());});
  return{
    reload(){loaders.forEach(f=>f());},
    doc(p){const r=T(p);return{
      set:async d=>chk(await sb.from(r.t).upsert({[r.k]:r.v,data:d,updated_at:new Date().toISOString(),...(r.t==='managers'?{club:d.club||null}:{})})),
      delete:async()=>chk(await sb.from(r.t).delete().eq(r.k,r.v)),
      onSnapshot(next,err){const load=async()=>{const {data,error}=await sb.from(r.t).select('data').eq(r.k,r.v).maybeSingle();if(error){err&&err(error);return;}next({exists:!!data,data:()=>data&&data.data});};watch(r.t,load);load();}};},
    collection(c){const r=T(c);return{
      onSnapshot(next,err){const load=async()=>{const {data,error}=await sb.from(r.t).select(r.k+',data');if(error){err&&err(error);return;}next({docs:(data||[]).map(x=>({id:r.t==='managers'?x[r.k]:'r'+x[r.k],data:()=>x.data}))});};watch(r.t,load);load();}};}
  };
}
function authErr(e){const m=String(e&&e.message||'');
  if(/invalid login/i.test(m))return'Email o contraseña incorrectos';
  if(/not confirmed/i.test(m))return'Confirma tu email antes de entrar (revisa tu correo)';
  if(/already registered|already been registered/i.test(m))return'Ese email ya tiene cuenta. Entra con él.';
  if(/password/i.test(m)&&/6|characters|short/i.test(m))return'La contraseña debe tener al menos 6 caracteres';
  if(/rate limit|too many/i.test(m))return'Demasiados intentos. Espera un poco.';
  if(/valid email|invalid email|email address/i.test(m))return'Ese email no es válido';
  return m||'Algo ha fallado. Inténtalo de nuevo.';}
function authCard(){
  if(auth==='newpass')return`<h2>Nueva contraseña</h2><label class="f">Contraseña nueva<input id="au-pass" type="password" autocomplete="new-password" minlength="6"></label><button class="btn primary" data-cv="au-newpass">Guardar contraseña</button>`;
  if(auth==='reset')return`<h2>Recuperar contraseña</h2><p style="margin:0">Te enviamos un enlace a tu correo para elegir una nueva.</p><label class="f">Email<input id="au-email" type="email" autocomplete="email" inputmode="email"></label><button class="btn primary" data-cv="au-reset">Enviarme el enlace</button><button class="cv-link" data-cv="au-login">Volver</button>`;
  const su=auth==='signup';
  return`<h2>${su?'Crea tu cuenta':'¿Te apuntas?'}</h2>${authMsg?`<div class="note" style="margin:0">${esc(authMsg)}</div>`:''}
    <label class="f">Email<input id="au-email" type="email" autocomplete="email" inputmode="email"></label>
    <label class="f">Contraseña<input id="au-pass" type="password" autocomplete="${su?'new-password':'current-password'}" minlength="6" placeholder="${su?'Mínimo 6 caracteres':''}"></label>
    <button class="btn primary" data-cv="${su?'au-signup':'au-signin'}">${su?'Registrarme':'Entrar'}</button>
    ${su?`<button class="cv-link" data-cv="au-login">Ya tengo cuenta</button>`:`<button class="btn" data-cv="au-signupform">Crear una cuenta nueva</button><button class="cv-link" data-cv="au-resetform">He olvidado mi contraseña</button>`}
    <button class="cv-link" data-cv="enter">Solo quiero mirar la liga</button>`;
}
async function authAction(k,b){
  const v=id=>{const el=$(id);return el?el.value.trim():'';},back=location.origin+location.pathname;
  if(k==='au-login'||k==='au-signupform'||k==='au-resetform'){auth=k==='au-signupform'?'signup':k==='au-resetform'?'reset':'login';authMsg='';renderCover();const el=$('#au-email');el&&el.focus();return;}
  const email=v('#au-email'),pass=($('#au-pass')||{}).value||'';
  if(k!=='au-newpass'&&!email){toast('Escribe tu email');return;}
  if((k==='au-signin'||k==='au-signup'||k==='au-newpass')&&pass.length<6){toast('La contraseña debe tener al menos 6 caracteres');return;}
  b.disabled=true;let r;
  try{
    if(k==='au-signin'){r=await sb.auth.signInWithPassword({email,password:pass});if(r.error)throw r.error;authMsg='';}
    else if(k==='au-signup'){r=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:back}});if(r.error)throw r.error;
      if(!r.data.session){auth='login';authMsg='Te hemos enviado un email para confirmar la cuenta. Ábrelo y después entra aquí.';renderCover();}}
    else if(k==='au-reset'){r=await sb.auth.resetPasswordForEmail(email,{redirectTo:back});if(r.error)throw r.error;auth='login';authMsg='Si ese email tiene cuenta, te llegará un enlace para cambiar la contraseña.';renderCover();}
    else if(k==='au-newpass'){r=await sb.auth.updateUser({password:pass});if(r.error)throw r.error;auth='login';authMsg='';toast('Contraseña cambiada');render();}
  }catch(e){toast(authErr(e));}
  finally{if(b.isConnected)b.disabled=false;}
}
async function setSession(s){
  const id=s&&s.user?s.user.id:null;if(ME.checked&&id===ME.id)return;
  let owner=false;if(id){try{const {data}=await sb.rpc('is_admin');owner=!!data;}catch(e){}}
  ME={id,owner,checked:true,email:s&&s.user?s.user.email:''};readOnly=false;
  if(!id){if(tab==='admin')tab='equipo';cover=true;cvForm=false;}
  if(db)db.reload();render();
}
$('#who').addEventListener('click',async e=>{const b=e.target.closest('[data-hdr]');if(!b)return;
  if(b.dataset.hdr==='in'){cover=true;auth='login';render();scrollTo(0,0);}
  else if(armed(b,'¿Salir?')){await sb.auth.signOut();}});

render();
(async()=>{
  const C=window.ONCE_CONFIG||{};
  if(!window.supabase||!C.url||!C.key){noDb=true;render();return;}
  sb=window.supabase.createClient(C.url,C.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  db=makeDb(sb);
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='PASSWORD_RECOVERY'){auth='newpass';cover=true;}setTimeout(()=>setSession(s),0);});
  const {data:{session}}=await sb.auth.getSession();await setSession(session);
  let gotL=false,gotM=false,gotJ=false;
  const done=()=>{if(gotL&&gotM&&gotJ)ready=true;if(!typing())render();};
  db.doc('liga/estado').onSnapshot(s=>{L=s.exists?normalize(s.data()):null;gotL=true;done();},
    ()=>{if(!gotL){noDb=true;render();}else toast('Se perdió la conexión con la liga. Recarga la página.');});
  db.collection('managers').onSnapshot(s=>{MG=s.docs.map(x=>({id:x.id,...x.data()}));gotM=true;done();},()=>{gotM=true;done();});
  db.collection('jornadas').onSnapshot(s=>{const o={};s.docs.forEach(x=>{const v=x.data();if(v&&v.round)o[v.round]=v;});JS=o;gotJ=true;done();},()=>{gotJ=true;done();});
})();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
